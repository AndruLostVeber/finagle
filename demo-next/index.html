<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо «Куро Продакшн»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: игровая сцена 1280×720 масштабируется под окно; офис в разрезе, дневник дня поверх, панель инструментов снизу */
:root{
  --ink:#1E1B18; --ink-mut:#6E665C; --paper:#FBF8F1; --paper-2:#EFE7D6; --line:#DDD3C0;
  --teal:#1F6F68; --teal-d:#134944; --aqua:#48C6B4; --mustard:#E2A93B; --red:#C4453B; --indigo:#3E4F86; --wine:#8A3B36;
  --hud:#121C1B; --hud-fg:#E4EFEC; --hud-mut:#8DAAA5; --page:#0B1110;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--hud-fg);font-family:var(--f-body);overflow:hidden}
#vp{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#frame{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:10px;background:#0E1716;color:var(--ink);font-size:15px;line-height:1.45;box-shadow:0 30px 80px -30px #000}
#narrow{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--hud-mut)}
#scr,#ov{position:absolute;inset:0}
#ov{pointer-events:none}
#ov>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
table{color:inherit;font:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.bg,.bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- comic: вступление при первом запуске ---------- */
.comic{position:absolute;inset:0;background:#15110D radial-gradient(circle at 1px 1px,#2B241C 1.1px,transparent 1.7px) 0 0/9px 9px;cursor:pointer}
.cpage{position:absolute;left:24px;right:24px;top:20px;height:604px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:14px}
.cpanel{position:relative;overflow:hidden;background:#0D0B09;border:4px solid #F7F1E3;box-shadow:0 0 0 2px #000,0 14px 30px -12px #000;border-radius:3px}
.cpanel.off{background:repeating-linear-gradient(135deg,#1D1813 0 10px,#191510 10px 20px);border-color:#3A332A;box-shadow:none}
.cpanel svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.cpanel.cur{animation:cpop .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cpop{from{transform:scale(.88) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.cap{position:absolute;left:10px;top:10px;max-width:80%;background:#F5D76E;color:#1E1B18;font:600 12px/1.3 var(--f-display);letter-spacing:.02em;padding:7px 10px;border:2px solid #1E1B18;box-shadow:3px 3px 0 #1E1B18;text-transform:uppercase}
.cbub{position:absolute;background:#fff;color:#1E1B18;font:700 16px/1.2 var(--f-body);padding:9px 14px;border:2.5px solid #1E1B18;border-radius:18px;max-width:56%;width:max-content}
.cbub.you{background:#FFF1C7}
.cbub::after{content:"";position:absolute;width:14px;height:14px;background:inherit;border-right:2.5px solid #1E1B18;border-bottom:2.5px solid #1E1B18}
.cbub.d-l::after{left:20px;bottom:-9px;transform:rotate(45deg)}
.cbub.d-r::after{right:20px;bottom:-9px;transform:rotate(45deg)}
.cbub.u-l::after{left:20px;top:-9px;transform:rotate(225deg)}
.cbub.u-r::after{right:20px;top:-9px;transform:rotate(225deg)}
.cpanel.cur .cbub{animation:bpop .35s .4s both}
.cpanel.cur .cbub+.cbub{animation-delay:.9s}
@keyframes bpop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.cpanel.cur .stamp{animation:stamp .45s .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:rotate(-14deg);opacity:1}}
.cpanel.cur .ring{animation:ring .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 90%}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.cbar{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.cbar .skip{background:transparent;border:0;color:#B9AE9C;font-size:14px;padding:10px 4px}
.cbar .skip:hover{color:#fff}
.cbar .dots{display:flex;gap:8px}
.cbar .dots i{width:9px;height:9px;border-radius:50%;background:#3A332A}
.cbar .dots i.on{background:var(--mustard)}
/* ---------- настройки мира ---------- */
.sheet.create{width:620px;max-height:660px;box-sizing:border-box}
.join-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.join-fields .field{min-width:0}
.create .team-status:empty,.create #setup-err:empty{display:none}
.create input{box-sizing:border-box;min-width:0;width:100%;caret-color:var(--teal)}
.cgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
.cfields{display:grid;gap:14px}
.cworld{background:#F3EEDF;border-radius:10px;overflow:hidden;display:grid}
.cworld .cw-art{height:150px;position:relative}
.cworld .cw-art svg{position:absolute;inset:0;width:100%;height:100%}
.cworld .cw-body{padding:14px 18px 18px;display:grid;gap:8px}
.cworld b{font-family:var(--f-display);font-weight:500;font-size:17px}
.cworld ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.ctoggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctoggles .toggle:first-child{grid-column:1/-1}
/* ---------- приход в деловой центр (демо без 3D) ---------- */
.arrive2d{position:absolute;inset:0;overflow:hidden;background:#000}
.arrive2d .a2{position:absolute;inset:0;animation:a2zoom 3.4s ease-in forwards;transform-origin:50% 86%}
.arrive2d .a2 svg{width:100%;height:100%;display:block}
.arrive2d::after{content:"";position:absolute;inset:0;background:#000;animation:a2fade 3.4s forwards;pointer-events:none}
@keyframes a2zoom{to{transform:scale(5)}}
@keyframes a2fade{0%,72%{opacity:0}100%{opacity:1}}
.a2cap{position:absolute;left:60px;top:54px;color:#fff;display:grid;gap:4px;text-shadow:0 2px 10px #000;animation:a2capin .6s .2s both}
.a2cap b{font:500 30px var(--f-display)}
.a2cap span{font-size:17px;opacity:.85}
@keyframes a2capin{from{opacity:0;transform:translateY(8px)}}

/* ---------- common ---------- */
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.btn:hover{background:#25817A}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--teal);color:var(--teal)}
.btn.warn{background:var(--red);box-shadow:0 3px 0 #8E2E27}
.btn:disabled{opacity:.45;box-shadow:none}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mut);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- title ---------- */
.title-logo{position:absolute;left:80px;top:110px;display:grid;gap:10px}
.title-logo h1{font-family:var(--f-display);font-size:64px;line-height:.95;color:#FFF6E6;letter-spacing:.01em}
.title-logo h1 span{display:block;color:var(--aqua)}
.menu{position:absolute;left:80px;top:360px;display:grid;gap:10px;width:300px}
.menu button{text-align:left;border:0;background:rgba(14,22,24,.62);color:#F4EBDD;padding:13px 18px;border-radius:10px;font-size:17px;font-weight:500;backdrop-filter:blur(3px);display:flex;justify-content:space-between;align-items:center}
.menu button:hover:not(:disabled){background:var(--teal);color:#fff}

/* ---------- sheets ---------- */
.sheet-wrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,16,18,.45)}
.sheet{width:900px;max-height:640px;overflow:auto;padding:30px 36px;display:grid;gap:20px}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:26px}
.sheet .row{display:flex;gap:12px;justify-content:flex-end}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:14px 16px;text-align:left;display:grid;gap:4px}
.opt b{font-size:16px}
.opt span{font-size:13.5px;color:var(--ink-mut)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#EEF7F5}
.opt:disabled{opacity:.55}
.field{display:grid;gap:6px;font-size:14px}
.field input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.toggle{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;text-align:left}
.toggle .sw{flex:none;width:44px;height:24px;border-radius:12px;background:#CFC6B5;position:relative;margin-top:2px}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .sw{background:var(--teal)}
.toggle[aria-pressed="true"] .sw::after{left:23px}
.toggle b{display:block;font-size:15px}
.toggle span{font-size:13.5px;color:var(--ink-mut)}
.folder{width:940px;height:600px;position:relative;display:grid;grid-template-rows:auto 1fr}
.tabs{display:flex;gap:4px;padding-left:24px}
.tabs button{border:0;background:#D9C9A8;color:var(--ink);padding:10px 18px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--paper)}
.folder .paper{border-radius:0 8px 8px 8px;padding:30px 36px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.memo-body{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-content:start}
.memo-body ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15.5px}
.memo-ex{background:#F3EEDF;border-radius:8px;padding:16px 18px;display:grid;gap:8px;font-size:14px;align-content:start}
.memo-ex .ln{display:grid;grid-template-columns:70px 70px 1fr;font-family:var(--f-mono);font-size:13.5px;border-bottom:1px dashed #CDBF9F;padding:4px 0}

/* ---------- scene ---------- */
.por{position:absolute;bottom:110px;width:380px;height:500px;transition:filter .25s,transform .25s,opacity .3s}
.por svg{width:100%;height:100%;display:block}
.por.L{left:90px}
.por.R{right:90px}
.por.dim{filter:brightness(.55) saturate(.7);transform:translateY(10px)}
.por.hide{opacity:0}
.dlg{position:absolute;left:64px;right:64px;bottom:22px;min-height:118px;padding:28px 34px 44px;border-radius:16px;background:rgba(251,248,241,.97);color:var(--ink);box-shadow:0 18px 40px -14px rgba(0,0,0,.7)}
.dlg.nar{background:rgba(14,20,22,.88);color:#EDE4D3;font-style:italic}
.dlg .who{position:absolute;left:28px;top:-20px;padding:8px 18px;border-radius:9px;font-family:var(--f-display);font-size:15px;color:#fff;font-style:normal}
.dlg .txt{font-size:20px;line-height:1.5;max-width:68ch}
.big .dlg .txt,.big .talk .say{font-size:23px}
.dlg .ctl{position:absolute;right:20px;bottom:12px;display:flex;gap:6px}
.dlg .ctl button{border:0;background:transparent;font-size:13px;color:inherit;opacity:.65;padding:4px 8px;border-radius:6px}
.dlg .ctl button:hover{opacity:1;background:rgba(127,127,127,.15)}
.dlg .ctl .nx{opacity:1;font-weight:600}
.loc{position:absolute;left:24px;top:20px;background:rgba(14,20,22,.75);color:#EDE4D3;padding:7px 14px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center}
.loc b{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.06em;color:var(--mustard)}
.asks{position:absolute;left:50%;transform:translateX(-50%);bottom:236px;display:grid;gap:12px;width:560px;animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
.ask-h{justify-self:center;font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.08em;color:#fff;background:var(--red);padding:8px 26px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}

/* ---------- game popups and choices ---------- */
@keyframes popIn{from{transform:translateX(var(--tx,0)) scale(.75);opacity:0}to{transform:translateX(var(--tx,0)) scale(1);opacity:1}}
.asks{--tx:-50%}
.gpop{position:relative;width:460px;background:linear-gradient(180deg,#25433F,#172D2A);border-radius:18px;padding:44px 30px 26px;color:#F4EBDD;box-shadow:0 0 0 3px #C9A452,0 0 0 8px #0F201E,0 28px 60px -18px #000;text-align:center;display:grid;gap:14px;justify-items:center;animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
.ribbon{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--f-display);font-weight:500;font-size:15px;padding:10px 36px;white-space:nowrap;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.gi{width:66px;height:66px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:inset 0 -5px 0 #D9CBB0,0 0 0 4px #C9A452}
.gi svg{width:38px;height:38px}
.gpop p{font-size:16px;color:#E6DCCB;max-width:34ch}
.gacts{display:flex;gap:12px;justify-content:center;margin-top:6px}
.gbtn{border:0;border-radius:12px;padding:12px 20px 13px;font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;background:var(--mustard);color:#2A1A04;box-shadow:0 5px 0 #9C6F1A,0 10px 16px -8px #000;display:inline-flex;gap:10px;align-items:center;justify-content:center;white-space:nowrap;transition:transform .08s,filter .12s}
.gbtn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.gbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #9C6F1A}
.gbtn.alt{background:#3A5651;color:#E4EFEC;box-shadow:0 5px 0 #1C2F2C,0 10px 16px -8px #000}
.gbtn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 #7E2A23,0 10px 16px -8px #000}
.gbtn:disabled{opacity:.45;filter:grayscale(.5);transform:none}
.kc{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.2);font-family:var(--f-mono);font-size:11px;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.gopts{display:grid;gap:10px}
.gopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:14px;padding:13px 18px;background:var(--paper);color:var(--ink);font-size:17px;font-weight:600;box-shadow:0 5px 0 #CDBF9F,0 12px 20px -12px #000;transition:transform .1s,box-shadow .1s,background .1s}
.gopt .kc{background:var(--teal);color:#fff;min-width:30px;height:30px;font-size:14px;border-radius:8px;box-shadow:inset 0 -3px 0 var(--teal-d)}
.gopt::after{content:"▸";margin-left:auto;color:var(--red);font-size:18px;opacity:0;transform:translateX(-8px);transition:opacity .15s,transform .15s}
.gopt:hover,.gopt:focus-visible{transform:translateY(-3px);background:#FFF4D8;box-shadow:0 8px 0 #D9B25A,0 16px 24px -12px #000;outline:none}
.gopt:hover .kc,.gopt:focus-visible .kc{background:var(--mustard);color:#2A1A04;box-shadow:inset 0 -3px 0 #9C6F1A}
.gopt:hover::after,.gopt:focus-visible::after{opacity:1;transform:none}
.gopt:active{transform:translateY(2px);box-shadow:0 2px 0 #CDBF9F}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--hud);color:var(--hud-fg);font-size:13px;white-space:nowrap;z-index:2}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em}
.brand b{color:var(--aqua)}
.hud .stg{padding:4px 10px;border-radius:999px;background:#1B3330;color:var(--aqua);font-weight:600}
.hud .mut{color:var(--hud-mut)}
.hud .day{font-weight:600}
.hud .sp{flex:1}
.hud .cash b{font-family:var(--f-mono);font-size:14px}
.hud .cash.neg b{color:#FF8A7E}
.hud .learn{padding:3px 9px;border-radius:6px;background:#3A2F14;color:var(--mustard);font-size:12px}
.hud .tm{font-family:var(--f-mono);font-size:16px;color:var(--mustard)}
.hud button{border:1px solid #2F4A47;background:transparent;color:var(--hud-fg);border-radius:7px;padding:5px 11px;font-size:13px}
.hud button:hover{border-color:var(--aqua)}

/* ---------- office ---------- */
.office{position:absolute;left:0;right:0;top:48px;bottom:0;overflow:hidden}
.office .lbl{opacity:0;transition:opacity .12s;pointer-events:none}
.office .hot:hover .lbl,.office .hot:focus .lbl{opacity:1}
.office .pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 9px rgba(255,214,120,1))}}
.office svg{display:block;width:100%;height:100%}
.office [data-act]{cursor:pointer}
.office .hot{transition:filter .15s}
.office .hot:hover,.office .hot:focus{filter:brightness(1.12) drop-shadow(0 0 6px rgba(255,236,170,.9));outline:none}
.office .bang{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.tbar{position:absolute;left:0;right:0;bottom:0;height:80px;background:#1A2422;display:flex;align-items:center;gap:6px;padding:0 14px;border-top:2px solid #2C3D3A}
.tb{position:relative;border:0;background:transparent;color:#DDE8E5;display:grid;justify-items:center;gap:3px;font-size:11.5px;padding:6px 8px;border-radius:9px;min-width:74px}
.tb svg{width:34px;height:30px}
.tb:hover{background:#26413D}
.tb.main{background:#26413D;color:#fff;min-width:96px}
.tb.main:hover{background:var(--teal)}
.tb .badge{position:absolute;top:2px;right:12px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tbar .sp{flex:1}
.tbar .left{font-size:12.5px;color:var(--hud-mut);margin-right:6px}
.tbar .btn{padding:12px 20px}

/* ---------- diary book ---------- */
.book-back{position:absolute;inset:48px 0 80px;background:rgba(8,14,15,.55);z-index:4;display:grid;place-items:center}
.book{width:1190px;height:572px;display:grid;grid-template-columns:400px 1fr;background:#6E4E36;border-radius:14px;padding:10px;gap:0;box-shadow:0 26px 60px -20px rgba(0,0,0,.8)}
.pg{background:var(--paper);color:var(--ink);min-height:0;position:relative}
.pg.l{border-radius:8px 2px 2px 8px;padding:22px 22px 16px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.25)}
.pg.r{border-radius:2px 8px 8px 2px;display:grid;grid-template-rows:minmax(0,1fr) auto;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.25)}
.pg.l h2{font-family:var(--f-display);font-weight:500;font-size:23px;line-height:1.1}
.pg.l .dk{font-size:12.5px;color:var(--ink-mut)}
.news{font-size:13px;background:#F1EADB;border-radius:6px;padding:8px 10px;font-style:italic}
.news b{font-style:normal}
.tasks{overflow:auto;display:grid;gap:8px;align-content:start;padding:2px}
.tcard{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.tcard[aria-current="true"]{border-color:var(--teal);box-shadow:0 0 0 2px #CFE6E2}
.tcard .k{font-family:var(--f-mono);font-size:11px;color:var(--ink-mut)}
.tcard b{font-size:14px;grid-column:1}
.tcard .st{grid-row:1/3;grid-column:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F1EADB;color:var(--ink-mut)}
.tcard .st.new{background:#FFF0D1;color:#9A6512}
.tcard .st.ch{background:#F8DCD9;color:var(--red)}
.tcard .st.ok{background:#D7EDE9;color:var(--teal)}
.pg-foot{display:flex;gap:8px;align-items:center}
.pg-foot .btn{padding:10px 16px;font-size:14px}
.rscroll{overflow:auto;padding:22px 26px 10px;display:flex;flex-direction:column;gap:12px;position:relative}
.rscroll>*{flex-shrink:0}
.rhead{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-mut);border-bottom:1px dashed #D7CDB8;padding-bottom:8px}
.rscroll h3{font-size:20px;line-height:1.25;padding-right:200px}
.rscroll p{font-size:14.5px;max-width:70ch}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att button{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;border:1px solid #D6CCB8;background:#fff;font-size:12.5px}
.att button::before{content:"";width:9px;height:11px;border:1.5px solid var(--ink-mut);border-radius:1px 4px 1px 1px}
.att button:hover{border-color:var(--teal);color:var(--teal)}
.note{position:absolute;right:20px;top:40px;width:186px;background:#F5DE77;padding:9px 12px 12px;transform:rotate(3deg);box-shadow:0 10px 18px -8px rgba(0,0,0,.45);font-family:var(--f-hand);font-size:20px;line-height:1.05;color:#3A2E05;z-index:2}
.note small{display:block;font-family:var(--f-body);font-size:10.5px;color:#6A5815;margin-bottom:3px}
.choice-sum{display:grid;gap:6px;font-size:13.5px}
.choice-sum div{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 10px;background:#F4EFE3;border-radius:6px}
.choice-sum b{font-family:var(--f-display);color:var(--teal)}
.stampd{display:inline-block;align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--red);border:2.5px solid var(--red);border-radius:6px;padding:4px 9px;transform:rotate(-3deg)}

/* ledger inside the book */
.ledger{background:#EDF5E8;border-radius:8px;border:1px solid #C9DCC0;overflow:hidden;position:relative}
.lg-head{padding:9px 14px 8px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--red);background:#E6F0E0}
.lg-head b{font-family:var(--f-display);font-weight:500;font-size:13px}
.lg-head span{font-size:11.5px;color:var(--ink-mut)}
.lg-cols{display:grid;grid-template-columns:1fr 1fr 110px 24px;gap:10px;padding:6px 14px 2px 40px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mut);font-weight:600}
.lg-cols span:nth-child(3){text-align:right}
.op{padding:6px 14px 8px;display:grid;gap:4px}
.op+.op{border-top:1px solid #BFD5B5}
.op-h{display:flex;align-items:center;gap:8px}
.op-n{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.op-t{flex:1;font-weight:600;font-size:13.5px}
.none-btn{border:1px solid #9DB59A;background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px}
.none-btn[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.lrow{display:grid;grid-template-columns:1fr 1fr 110px 24px;gap:10px;align-items:center;padding-left:26px;min-height:32px}
.lrow select,.lrow input{font:inherit;font-family:var(--f-mono);font-size:12.5px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed #95AE92;padding:4px 2px;width:100%;border-radius:0;min-width:0}
.lrow input{text-align:right}
.lrow input::placeholder{color:#9DAF9B}
.lrow .del{border:0;background:transparent;color:var(--ink-mut);font-size:17px;line-height:1;padding:2px}
.lrow .del:hover{color:var(--red)}
.lrow.ro span{font-family:var(--f-mono);font-size:12.5px}
.lrow.ro .amt{text-align:right}
.mk{font-weight:700;text-align:center}
.mk.ok{color:#1C7C4A}
.mk.no{color:var(--red)}
.add{justify-self:start;margin-left:26px;border:0;background:transparent;color:var(--teal);font-size:12.5px;font-weight:600;padding:2px 0}
.op-none{margin-left:26px;font-family:var(--f-display);font-size:13px;color:var(--teal);display:flex;gap:10px;align-items:center}
.op-err{margin-left:26px;color:var(--red);font-size:12px}
.op.bad .op-n{background:var(--red)}
.learnb{margin:4px 0 0 26px;background:#FFF9E8;border:1px solid #EBD9A6;border-radius:6px;padding:8px 10px;font-size:12px;display:grid;gap:4px}
.learnb .ref{font-family:var(--f-mono);font-size:12px;display:flex;gap:10px}
.learnb .sc{font-weight:700;color:var(--teal)}
.autos{margin:6px 14px 10px;padding-top:6px;border-top:1px dashed #9DB59A;display:grid;gap:2px}
.autos .lrow{padding-left:10px;min-height:22px;color:#7B8B79;font-style:italic}
.autos .lrow span{font-size:11.5px}
.autos p{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mut);font-weight:600}
.autos .loan{color:var(--wine)}
.rfoot{padding:10px 20px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#F6F1E4;border-radius:0 0 8px 0}
.rfoot .btn{margin-left:auto;padding:10px 16px;font-size:14px}
.lg-hint{font-size:12px;color:var(--ink-mut);flex:1}
.lg-hint.err{color:var(--red)}
.stamp{position:absolute;right:20px;top:46px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--red);border:3px solid var(--red);border-radius:6px;padding:5px 11px;transform:rotate(-9deg);opacity:.85;letter-spacing:.06em;pointer-events:none;animation:stampIn .32s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.stamp small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:0}
@keyframes stampIn{from{transform:rotate(-9deg) scale(1.7);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.85}}

/* ---------- modals ---------- */
.mback{position:absolute;inset:0;background:rgba(8,14,15,.6);display:grid;place-items:center;z-index:8}
.modal{width:560px;max-height:620px;overflow:auto;padding:24px 26px;display:grid;gap:14px;position:relative;align-content:start}
.modal h3{font-size:19px}
.modal .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-mut)}
.modal table{border-collapse:collapse;width:100%;font-size:13.5px}
.modal td,.modal th{padding:6px 7px;border-bottom:1px solid #E5DCCB;text-align:left;vertical-align:top}
.modal td.r,.modal th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.modal .x{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:22px;color:var(--ink-mut)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
.modal .lnk{border:0;background:transparent;color:var(--teal);font-weight:600;padding:0;text-align:left}
.accs{columns:2;column-gap:22px;font-size:13px;margin:0;padding:0;list-style:none}
.accs li{break-inside:avoid;padding:3px 0}
.accs b{font-family:var(--f-mono);display:inline-block;width:28px}
.pause{width:380px;padding:26px;display:grid;gap:8px}
.pause h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin-bottom:6px}
.pause button{text-align:left;border:0;background:#F1EADB;border-radius:9px;padding:11px 14px;font-size:15px}
.pause button:hover{background:var(--teal);color:#fff}
.pause button.exit{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px #E9C4BF}
.calc{width:300px;padding:18px;display:grid;gap:10px;background:#2B2F33;color:#fff}
.calc .disp{background:#C9D6C0;color:#1E2A1E;font-family:var(--f-mono);font-size:26px;text-align:right;padding:10px 12px;border-radius:6px;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{border:0;border-radius:8px;padding:12px 0;font-size:18px;font-family:var(--f-mono);background:#454B52;color:#fff;box-shadow:0 3px 0 #1E2124}
.calc .keys button.op{background:#5E6670}
.calc .keys button.eq{background:var(--mustard);color:#2A1A04}
.calc .keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #1E2124}
.calc .x{color:#C9D4D2}
.phone-m{width:380px;background:#1A1D22;color:#E7EDEC;border-radius:28px;border:4px solid #2A2E35;padding:18px 14px;display:grid;gap:8px;max-height:600px;position:relative}
.phone-m h3{font-size:15px;text-align:center;color:#C9D4D2}
.phone-m .x{color:#C9D4D2;top:12px;right:16px}
.msgs{overflow:auto;display:flex;flex-direction:column;gap:6px;max-height:500px}
.msg{background:#2A3036;color:#E7EDEC;border-radius:12px 12px 12px 4px;padding:8px 11px;font-size:13px;line-height:1.35}
.msg b{display:block;font-size:11px;margin-bottom:1px}
.msg .d{float:right;font-size:10px;color:#8A9694;font-family:var(--f-mono)}
.msg.maria b{color:#6FD6C7}
.msg.petr b{color:#9DB0F0}
.msg.sys{background:#3A3420;color:#F1E3B6}
.msg.sys b{color:var(--mustard)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.calg .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);font-weight:600}
.calg .c{height:42px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);border:1px solid transparent;position:relative}
.calg .c.ev{border-color:#CFC5B2;background:#fff}
.calg .c.ev::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.calg .c.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.calg .c.done::after{background:#fff}
.calg .c.cur{background:var(--mustard);border-color:var(--mustard);font-weight:700}
.calg .c.we{color:#B5AB9A}

/* meeting */
.meet{position:absolute;inset:0;z-index:6;background:radial-gradient(900px 500px at 50% 40%,rgba(30,52,50,.92),rgba(8,14,15,.97));backdrop-filter:blur(3px)}
.meet .por{width:300px;height:394px;bottom:0}
.meet .por.L{left:10px}
.meet .por.R{right:10px}
.meet-mid{position:absolute;left:300px;right:300px;top:30px;bottom:24px;display:flex;flex-direction:column;gap:12px;color:#F4EBDD}
.meet-mid .k{font-family:var(--f-mono);font-size:12px;color:#B9C8C4}
.meet-mid h2{font-family:var(--f-display);font-weight:500;font-size:24px;color:#fff}
.meet-mid .lead{font-size:14px;color:#D6CCBC}
.mcards{display:grid;gap:12px;flex:1;min-height:0}
.mcards.c3{grid-template-columns:repeat(3,1fr)}
.mcards.c2{grid-template-columns:repeat(2,1fr)}
.mcard{position:relative;text-align:left;border:2px solid transparent;background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 26px -12px rgba(0,0,0,.7);transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-3px)}
.mcard[aria-pressed="true"]{border-color:var(--mustard)}
.mcard .lt{font-family:var(--f-display);font-size:26px;color:var(--teal);line-height:1}
.mcard h4{font-size:15px;line-height:1.25}
.mcard ul{margin:0;padding-left:16px;font-size:12.5px;display:grid;gap:4px;flex:1;align-content:start}
.mcard .cost{border-top:1px dashed #D7CDB8;padding-top:7px;display:grid;gap:2px}
.mcard .cost span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut)}
.mcard .cost b{font-family:var(--f-mono);font-size:17px}
.mcard .cost em{font-style:normal;font-size:11.5px;color:var(--red);line-height:1.3}
.mcard .who{font-size:11.5px;color:var(--ink-mut)}
.mcard .who b{color:var(--ink)}
.meet-foot{display:flex;align-items:center;gap:14px;background:rgba(251,248,241,.08);border-radius:10px;padding:10px 14px;font-size:13px;color:#D6CCBC}
.meet-foot b{color:#fff;font-family:var(--f-mono)}
.meet-foot .btn{margin-left:auto;white-space:nowrap}
.bubble{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 18px;font-size:17px;position:relative;box-shadow:0 12px 26px -12px rgba(0,0,0,.7)}
.bubble b{display:block;font-family:var(--f-display);font-weight:500;font-size:13px;margin-bottom:4px}
.eqt{background:var(--paper);color:var(--ink);border-radius:10px;overflow:auto;flex:1;min-height:0}
.eqt table{border-collapse:collapse;width:100%;font-size:13px}
.eqt th{position:sticky;top:0;background:#EFE7D6;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);padding:7px 8px;text-align:left}
.eqt td{padding:4px 8px;border-bottom:1px solid #E5DCCB}
.eqt td.t{display:flex;gap:4px}
.eqt .tier{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:12px;text-align:right}
.eqt .tier[aria-pressed="true"]{border-color:var(--teal);background:#E2F2EF;font-weight:700}
.eqt .tier.p[aria-pressed="true"]{border-color:#B9801F;background:#FBEBC9}
.eqt .tier.e[aria-pressed="true"]{border-color:#7E878A;background:#ECEFF0}
.eqt td.os{font-size:11px;color:var(--ink-mut);white-space:nowrap}
.eqt td.os b{color:var(--teal)}
.eq-sum{display:flex;gap:18px;font-size:13px;color:#D6CCBC;flex-wrap:wrap}
.eq-sum b{color:#fff;font-family:var(--f-mono)}
.eq-all{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#D6CCBC}
.eq-all>span:first-child{white-space:nowrap}
.eq-all>span:last-child{font-size:12px;text-align:right}
.eq-all button{border:1px solid #4A6A66;background:transparent;color:#F4EBDD;border-radius:6px;padding:3px 9px;font-size:12px}
.eq-all button:hover{border-color:var(--aqua)}

/* small talk */
.talk{position:absolute;left:0;right:0;bottom:0;top:48px;z-index:6;background:linear-gradient(180deg,transparent 30%,rgba(8,14,15,.7))}
.talk .por{width:300px;height:394px;bottom:0;left:40px}
.talk-box{position:absolute;left:350px;right:90px;bottom:26px;display:grid;gap:16px;animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
.bub{position:relative;background:var(--paper);color:var(--ink);border-radius:22px;padding:28px 28px 22px;box-shadow:0 16px 30px -14px #000}
.bub::before{content:"";position:absolute;left:-28px;bottom:24px;width:32px;height:28px;background:var(--paper);clip-path:polygon(100% 0,0 75%,100% 100%)}
.bub .tag{position:absolute;top:-17px;left:22px;color:#fff;font-family:var(--f-display);font-weight:500;font-size:14px;padding:7px 22px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%)}
.talk .say{font-size:20px;line-height:1.4}
.talk .gopts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.talk .note-s{font-size:12px;color:#C9D4D2;text-align:right}

/* night */
.night{position:absolute;inset:48px 0 0;z-index:5;display:grid;place-items:center;background:rgba(6,10,24,.35)}
.ncard{width:620px;padding:0;overflow:hidden;display:grid}
.ncard .top{background:#1D2847;color:#E9EEF8;padding:16px 26px;display:flex;justify-content:space-between;align-items:baseline}
.ncard .top b{font-family:var(--f-display);font-weight:500;font-size:20px}
.ncard .top span{font-size:13px;color:#AFB9D6}
.ncard .body{padding:18px 26px 22px;display:grid;gap:12px}
.ncard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.moods{display:flex;gap:16px}
.moods div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.moods svg{width:46px;height:60px;background:#F1EADB;border-radius:8px}
.close-t{font-family:var(--f-mono);font-size:12.5px;background:#F3EEDF;border-radius:6px;padding:8px 12px;display:grid;gap:2px}
.ncard .acts{display:flex;justify-content:flex-end}

/* stage 2, review */
.s2{position:absolute;left:0;right:0;top:48px;bottom:0;background:linear-gradient(180deg,#93613F,#7A4D31)}
.s2-form{position:absolute;left:16px;top:14px;bottom:14px;width:800px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:0}
.s2-form .paper{border-radius:0 6px 6px 6px;overflow:auto;padding:22px 28px}
.s2-form .tabs{padding-left:0}
.f-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.f-title h3{font-size:19px}
.f-title span{font-size:12px;color:var(--ink-mut)}
.demo-band{background:#FFF4D6;border:1px solid #EBD39A;border-radius:6px;padding:7px 12px;font-size:12.5px;margin-bottom:12px}
table.form{width:100%;border-collapse:collapse;font-size:13.5px}
.form th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
.form td{padding:4px 8px;border-bottom:1px solid #E3D9C6}
.form td.code{font-family:var(--f-mono);color:var(--ink-mut);width:56px}
.form td.v{width:150px}
.form td.v input{font:inherit;font-family:var(--f-mono);width:100%;text-align:right;border:0;border-bottom:1.5px dashed #BDAE90;background:transparent;padding:4px 2px;color:var(--ink)}
.form td.prev{width:110px;text-align:right;font-family:var(--f-mono);color:#B7AC98}
.form tr.sec td{font-weight:700;padding-top:12px;border-bottom:0}
.form tr.tot td{font-weight:700;background:#F3EEDF}
.form tr.tot td.v{text-align:right;font-family:var(--f-mono)}
.s2-foot{display:flex;justify-content:flex-end;padding-top:10px}
.s2-j{position:absolute;left:832px;right:16px;top:14px;bottom:14px;background:#EDF5E8;border-radius:6px;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.s2-j .flt{padding:8px 14px;display:flex;gap:8px;align-items:center;font-size:12.5px;border-bottom:1px solid #BFD5B5}
.s2-j .flt input{font:inherit;font-family:var(--f-mono);width:70px;padding:4px 6px;border:1px solid #9DB59A;border-radius:5px;background:#fff;color:var(--ink)}
.jlist{overflow:auto;padding:4px 0}
.jrow{display:grid;grid-template-columns:52px 34px 34px 1fr;gap:6px;padding:4px 14px;font-family:var(--f-mono);font-size:12px;border-bottom:1px solid #D5E5CD}
.jrow .a{text-align:right}
.jrow.auto{color:#7B8B79;font-style:italic}
.jrow.jh{font-family:var(--f-body);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);font-weight:600;position:sticky;top:-4px;background:#EDF5E8}
.review{position:absolute;left:150px;right:150px;top:24px;bottom:24px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0;overflow:hidden}
.rv-head{padding:22px 28px 16px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.rv-head h2{font-family:var(--f-display);font-weight:500;font-size:22px}
.rv-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0}
.rv-sum div{background:#F3EEDF;border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.rv-sum dt{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mut)}
.rv-sum dd{margin:0;font-family:var(--f-mono);font-size:20px}
.rv-sum dd small{font-size:12px;color:var(--ink-mut);font-family:var(--f-body)}
.rv-body{overflow:auto;padding:10px 28px 18px}
.rv-ev{padding:12px 0;border-bottom:1px solid #E3D9C6;display:grid;gap:8px}
.rv-ev h4{font-size:15px;display:flex;justify-content:space-between;gap:10px}

function scoreOp(op,ans){
  const res={t:op.t,ex:op.ex,ref:op.ref,scored:!!op.ref,rows:[],got:0,max:0,none:!!(ans&&ans.none),refOk:[]};
  const rows=(ans&&!ans.none)?ans.rows:[];
  if(!op.ref){res.rows=rows.map(r=>({r,ok:null}));return res;}
  if(op.ref.length===0){res.max=2;if(res.none)res.got=2;res.rows=rows.map(r=>({r,ok:false}));return res;}
  res.max=op.ref.length*2;const used=op.ref.map(()=>false);
  res.rows=rows.map(r=>{const v=parseAmt(r.amt).v;const k=op.ref.findIndex((x,j)=>!used[j]&&x[0]===r.dt&&x[1]===r.kt&&v!=null&&Math.abs(x[2]-v)<=0.1+1e-9);if(k>=0){used[k]=true;res.got+=2;return {r,ok:true};}return {r,ok:false};});
  res.refOk=used;return res;
}
function scoreAll(){
  let got=0,max=0;const evs=[];
  DAYS.forEach((d,i)=>dayTasks(i).forEach(id=>{const a=S.answers[id];if(!a||!a.done)return;const ops=taskOps(id);
    const eo={id,n:T[id].ev,title:T[id].title,date:dateStr(i),ops:[],got:0,max:0};
    ops.forEach((op,k)=>{const r=scoreOp(op,a.ops[k]);eo.ops.push(r);if(r.scored){eo.got+=r.got;eo.max+=r.max;}});
    got+=eo.got;max+=eo.max;evs.push(eo);}));
  return {got,max,pct:max?got/max:0,evs};
}
function allPostings(){
  const out=[];
  DAYS.forEach((d,i)=>dayTasks(i).forEach(id=>{const a=S.answers[id];if(a&&a.done)a.ops.forEach(o=>{if(!o.none)o.rows.forEach(r=>out.push({id,n:T[id].ev,dt:r.dt,kt:r.kt,amt:parseAmt(r.amt).v||0,kind:'you'}));});
    S.auto.filter(x=>x.id===id).forEach(x=>out.push(Object.assign({n:T[id].ev},x)));}));
  return out;
}
function monthClose(){
  const P=allPostings();const bal=a=>P.reduce((s,p)=>s+(p.dt===a?p.amt:0)-(p.kt===a?p.amt:0),0);
  const b26=r1(bal('26')),b44=r1(bal('44')),b90=r1(-bal('90')-b26-b44),b91=r1(-bal('91'));
  return {b26,b44,b90,b91,res:r1(b90+b91)};
}

let typeTimer=null;
function startScene(sc){S.scene={sc,i:0,present:{},emo:{},bg:sc.bg,log:[],asking:false,finmenu:false};S.screen='scene';applyLine();render();}
function applyLine(){
  const s=S.scene,L=s.sc.lines[s.i];if(!L)return;
  if(L.bg)s.bg=L.bg;
  if(L.show)L.show.forEach(w=>s.present[w]=true);
  if(L.set)Object.assign(s.emo,L.set);
  if(L.w&&CHARS[L.w]&&L.w!=='you'){s.present[L.w]=true;s.emo[L.w]=L.e||'neutral';}
  if(L.t)s.log.push({w:L.w,t:L.t});
  s.asking=!!L.ask;
}
function rScene(){
  const s=S.scene,L=s.sc.lines[s.i]||{};
  const sp=L.ask?(s.log[s.log.length-1]||{}).w:L.w;
  let por='';
  for(const w in s.sc.cast){const pos=s.sc.cast[w];const vis=s.present[w];
    por+=`<div class="por ${pos}${vis?'':' hide'}${vis&&sp!==w&&sp!=='nar'?' dim':''}">${portrait(w,s.emo[w])}</div>`;}
  let box='';
  if(L.ask){box=`<div class="asks"><span class="ask-h">ВАШ ОТВЕТ</span>${L.ask.map((a,i)=>`<button class="gopt" data-act="ask" data-i="${i}"><span class="kc">${i+1}</span>${esc(a.t)}</button>`).join('')}</div>`;const prev=s.log[s.log.length-1];if(prev)box+=dlgBox(prev.w,prev.t,true);}
  else if(L.t){box=dlgBox(L.w,L.t,false);}
  return `<div class="bg">${BG[s.bg]()}</div><div class="loc"><b>ЛОКАЦИЯ</b>${esc(LOC[s.bg]||'')}</div>${por}${box}`;
}
function dlgBox(w,t,static_){
  const c=CHARS[w];
  return `<div class="dlg${w==='nar'?' nar':''}" ${static_?'':'data-act="next"'}>${c&&c.color?`<span class="who" style="background:${c.color}">${c.name}</span>`:''}<p class="txt" id="dl-text" data-full="${esc(t)}">${static_?esc(t):''}</p>
  <div class="ctl"><button data-act="log">История</button>${static_?'':'<button data-act="skip">Пропустить</button><button class="nx" data-act="next">Далее ▸</button>'}</div></div>`;
}
function startTyping(){
  clearInterval(typeTimer);const el=$('#dl-text');if(!el||el.textContent)return;
  const full=el.dataset.full;
  if(SET.fast){el.textContent=full;el.dataset.done='1';return;}
  let i=0;el.dataset.done='';
  typeTimer=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typeTimer);el.dataset.done='1';}},18);
}
function nextLine(){
  const el=$('#dl-text');
  if(el&&!el.dataset.done){clearInterval(typeTimer);el.textContent=el.dataset.full;el.dataset.done='1';return;}
  const s=S.scene;if(s.asking)return;
  s.i++;const L=s.sc.lines[s.i];
  if(!L)return;
  if(L.end){sceneEnd(L.end);return;}
  applyLine();render();
}
function skipScene(){
  const s=S.scene;
  while(s.i<s.sc.lines.length-1){const L=s.sc.lines[s.i+1];if(L.ask||L.end)break;s.i++;applyLine();}
  const L=s.sc.lines[s.i+1];
  if(L&&L.end){render();sceneEnd(L.end);return;}
  if(L&&L.ask){s.i++;applyLine();}
  render();
}
function answerAsk(i){
  const s=S.scene,L=s.sc.lines[s.i],a=L.ask[i];
  const lines=s.sc.lines.slice();lines.splice(s.i+1,0,{w:'you',t:a.t},...a.reply);

}

const CONF={'75':'76','80':'84','51':'50','91':'26','76':'60','60':'76','08':'01','01':'08','10':'20','20':'26','26':'20','25':'26','19':'68','68':'19','62':'90','90':'62','66':'67','70':'69','69':'70','43':'90','44':'26'};

function testOf(id,i){
  const op=taskOps(id)[i],R=op.ref||[],key=id+'.'+i+JSON.stringify(R);
  if(TCACHE[key])return TCACHE[key];
  let sd=7;for(const c of key)sd=(sd*31+c.charCodeAt(0))%2147483647;sd=sd||1;
  const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const mix=L=>{for(let k=L.length-1;k>0;k--){const j=Math.floor(rn()*(k+1));[L[k],L[j]]=[L[j],L[k]];}return L;};
  const sw=(j,sd2)=>{const r=R[j];if(!r)return null;const x=CONF[r[sd2]];if(!x||x===r[1-sd2])return null;return R.map((y,q)=>q!==j?y:sd2?[y[0],x,y[2]]:[x,y[1],y[2]]);};
  const am=j=>{const r=R[j];if(!r)return null;const n=r[2]/1.22,v=Math.abs(n-Math.round(n))<.05?Math.round(n):r1(r[2]/2);return R.map((y,q)=>q===j?[y[0],y[1],v]:y);};
  const cand=R.length?[R.map(r=>[r[1],r[0],r[2]]),sw(0,0),sw(0,1),am(0),[],sw(1,0),sw(1,1),am(R.length-1),sw(2,0)]:(op.alt?op.alt():[]);
  const seen=new Set([JSON.stringify(R)]),pool=[];
  mix(cand.filter(Boolean)).forEach(c=>{const k=JSON.stringify(c);if(!seen.has(k)){seen.add(k);pool.push(c);}});
  const opts=mix([R,...pool.slice(0,R.length>1?4:2)]);
  return TCACHE[key]={opts,ok:opts.indexOf(R)};
}

  const ap=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:b;
  if(/\d/.test(k)){if(c.fresh||c.d==='0'||c.d==='Ошибка'){c.d=k;c.fresh=false;}else if(c.d.replace(/\D/g,'').length<14){const raw=c.d.replace(/\s/g,'')+k;const p=raw.split(',');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');c.d=p.join(',');}}
  else if(k===','){if(c.fresh){c.d='0,';c.fresh=false;}else if(!c.d.includes(','))c.d+=',';}
  else if(k==='C'){c.d='0';c.a=null;c.op=null;c.fresh=true;}
  else if(k==='⌫'){c.d=c.d.length>1?c.d.slice(0,-1).trimEnd():'0';}
  else if(k==='±'){show(-num());}
  else if(k==='%'){show(c.a!=null?c.a*num()/100:num()/100);c.fresh=true;}
  else if(k==='='){if(c.op!=null){show(ap(c.a,num(),c.op));c.a=null;c.op=null;c.fresh=true;}}
  else{if(c.op!=null&&!c.fresh){const v=ap(c.a,num(),c.op);show(v);c.a=v;}else c.a=num();c.op=k;c.fresh=true;}
  const d=$('#calc-d');if(d)d.textContent=c.d;
}

    TEAM.requestId=null;S.member=data.member;S.setup.team=data.team.name;S.setup.teamId=data.team.id;S.setup.league=data.member.league;
    S.memoBack=null;TEAM.busy=false;S.screen='waiting';render();refreshTeams();
  }catch(e){TEAM.busy=false;TEAM.error=e.message;render();const err=$('#setup-err');if(err)err.textContent=e.message;}
}
function recordDecision(id,delta,title,reason){
  if(S.finance.events.some(e=>e.id===id))return;
  const event={id,delta:r1(delta),title,reason,day:S.day};S.finance.events.push(event);
  persistGame();syncCompany();toast(`${reason}: ${signed(delta)} тыс. ₽ · прогноз ${signed(companyProfit())} тыс. ₽`);
}
function companyStrip(){return S.member&&!S.pc&&!S.modal&&!S.bookOpen&&!S.tray&&!S.meet&&!S.talk&&!S.night?`<div class="company-strip">${esc(S.setup.company)} · ${esc(S.setup.team)}${S.setup.learn?' · тренировка':''}<b>Прогноз ${signed(companyProfit())} тыс. ₽</b></div>`:'';}
function resultsBody(app){
  const own=TEAM.teams.find(t=>t.id===S.member?.teamId),profit=companyProfit(),goal=500;
  const stateNote=TEAM.error;
  const myEvents=S.finance.events.slice().reverse();
  const table=TEAM.teams.length?`<table><thead><tr><th>Место</th><th>Команда</th><th>Компании</th><th>Средняя прибыль, тыс. ₽</th><th>Решений</th></tr></thead><tbody>${TEAM.teams.map((t,i)=>`<tr class="${t.id===S.member?.teamId?'me':''}"><td>${i+1}</td><td>${esc(t.name)}${t.id===S.member?.teamId?' · ваша':''}</td><td>${t.members.length}</td><td class="${t.profit>=0?'profit-up':'profit-down'}">${signed(t.profit)}</td><td>${t.decisions}</td></tr>`).join('')}</tbody></table>`:'<p>Преподаватель пока не добавил команды.</p>';
  const members=own?`<h4>Своя команда · ${esc(own.name)}</h4><table><thead><tr><th>Участник</th><th>Компания</th><th>Прибыль, тыс. ₽</th><th>Решений</th></tr></thead><tbody>${own.members.map(m=>`<tr class="${m.id===S.member?.id?'me':''}"><td>${esc(m.name)}</td><td>${esc(m.company)}</td><td>${signed(m.id===S.member?.id?profit:m.profit)}</td><td>${m.id===S.member?.id?S.finance.events.length:m.decisions}</td></tr>`).join('')}</tbody></table>`:'';
  return `<h3>${app==='company'?esc(S.setup.company||'Моя компания'):'Рейтинг команд'}</h3><p class="team-status">${esc(stateNote)} <button class="lnk" data-act="refreshTeams">Обновить</button></p>
  ${S.member?`<div class="metrics"><div class="metric"><small>Мой прогноз прибыли · тыс. ₽</small><b class="${profit>=0?'profit-up':'profit-down'}">${signed(profit)}</b><small>${profit>=0?'Компания вышла в плюс':'До безубыточности: '+f1(-profit)}</small></div><div class="metric"><small>Цель · ${goal} тыс. ₽</small><b>${Math.round(Math.max(0,Math.min(100,(profit+250)/(goal+250)*100)))}%</b><small>Осталось: ${f1(Math.max(0,goal-profit))} тыс. ₽</small></div><div class="metric"><small>Место моей команды</small><b>${own?TEAM.teams.indexOf(own)+1:'—'}</b><small>${S.setup.learn?'Тренировка вне рейтинга':esc(S.setup.team)}</small></div></div>`:''}
  <p class="team-status">Прогноз, тыс. ₽: старт −250, верно +25, ошибка −35. Бухгалтерский результат — отдельно при закрытии месяца.</p>
  ${app==='company'?`<h4>История решений · ${myEvents.length}</h4><ul class="profit-feed">${myEvents.map(e=>`<li><span>${esc(e.title)}<br><small>${esc(e.reason)}</small></span><b class="${e.delta>=0?'profit-up':'profit-down'}">${signed(e.delta)} тыс. ₽</b></li>`).join('')||'<li>Примите первое решение в «Бухгалтерии».</li>'}</ul>`:`${table}`}${members}`;
}
window.kuroDayNote=()=>S.member?S.setup.company+' · '+S.setup.team+' · прогноз '+signed(companyProfit())+' тыс. ₽':'';
function start(data){if(data&&data.S&&data.S.member){S=data.S;}fit();render();refreshTeams();
  TEAM.poll=setInterval(()=>{persistGame();syncCompany();if(['create','waiting','rating'].includes(S.screen)||S.member||S.pc&&['company','results'].includes(S.app))refreshTeams();},5000);
  window.addEventListener('beforeunload',persistGame);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S:JSON.parse(JSON.stringify(S))}));}catch(e){}
const hotApi=window.claude&&window.claude.hot;
if(hotApi&&hotApi.ready)hotApi.ready(start);else start(hotApi&&hotApi.data||{});
})();
</script>
